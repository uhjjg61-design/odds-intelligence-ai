name: Sync historical basketball results

on:
  schedule:
    - cron: "13 4 * * *"
  workflow_dispatch:
    inputs:
      history_days:
        description: "Days of historical games to refresh (0-30)"
        required: false
        default: "7"
      days_ahead:
        description: "Upcoming days to sync (0-7)"
        required: false
        default: "3"

permissions:
  contents: read

concurrency:
  group: basketball-history-ingestion
  cancel-in-progress: false

jobs:
  sync-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASKETBALL_KEY: ${{ secrets.API_BASKETBALL_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SYNC_MODE: history
      HISTORY_DAYS: ${{ inputs.history_days || '7' }}
      DAYS_AHEAD: ${{ inputs.days_ahead || '3' }}
      ODDS_MAX_GAMES: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check provider credentials
        id: preflight
        shell: bash
        run: |
          if [[ -n "${API_BASKETBALL_KEY:-}" && -n "${SUPABASE_URL:-}" && -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Basketball history sync skipped. Configure API_BASKETBALL_KEY, SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY."
          fi
      - name: Set up Python
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync historical basketball games
        if: steps.preflight.outputs.configured == 'true'
        run: python scripts/sync_api_basketball.py
