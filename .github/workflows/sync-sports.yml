name: Sync live football fixtures

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      sync_mode:
        description: "Run live sync or a full historical backfill"
        type: choice
        required: true
        default: "live"
        options:
          - live
          - history
          - full

permissions:
  contents: read

concurrency:
  group: football-live-ingestion
  cancel-in-progress: false

jobs:
  sync-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SYNC_MODE: ${{ inputs.sync_mode || 'live' }}
      HISTORY_DAYS: "7"
      DAYS_AHEAD: "3"
      ODDS_MAX_FIXTURES: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check provider credentials
        id: preflight
        shell: bash
        run: |
          if [[ -n "${API_FOOTBALL_KEY:-}" && -n "${SUPABASE_URL:-}" && -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Ingestion skipped. Configure API_FOOTBALL_KEY, SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY in repository Actions secrets."
          fi
      - name: Set up Python
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync fixtures
        if: steps.preflight.outputs.configured == 'true'
        run: python scripts/sync_api_football.py
