services:
  - type: web
    name: odds-intelligence-analytics-api
    runtime: docker
    plan: free
    dockerfilePath: ./services/analytics-api/Dockerfile
    dockerContext: ./services/analytics-api
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: CORS_ORIGINS
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: INGEST_API_TOKEN
        sync: false
